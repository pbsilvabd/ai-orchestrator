name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Run check gate
        run: npm run check:ci

      - name: Fail on high-severity dependency advisories
        run: npm audit --audit-level=high

  unit:
    name: Unit and coverage / ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Verify nonzero pipeline exit (PowerShell)
        if: runner.os == 'Windows'
        id: powershell_pipeline_fixture
        continue-on-error: true
        shell: pwsh
        run: node -e "process.exit(7)" | Out-String

      - name: Fail if PowerShell masked the pipeline exit
        if: runner.os == 'Windows' && steps.powershell_pipeline_fixture.outcome != 'failure'
        shell: pwsh
        run: throw 'The expected nonzero pipeline unexpectedly succeeded.'

      - name: Verify nonzero pipeline exit (Bash)
        if: runner.os != 'Windows'
        id: bash_pipeline_fixture
        continue-on-error: true
        shell: bash
        run: node -e 'process.exit(7)' | cat

      - name: Fail if Bash masked the pipeline exit
        if: runner.os != 'Windows' && steps.bash_pipeline_fixture.outcome != 'failure'
        shell: bash
        run: exit 1

      - name: Run suite with coverage thresholds (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run suite with coverage thresholds (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: npm run coverage

  smoke:
    name: Smoke demo / ${{ matrix.os }}
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Run fallback demo (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node examples/fallback-demo.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run fallback demo (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: node examples/fallback-demo.mjs

  drift:
    name: Schema and lockfile drift / ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install strictly from the lockfile
        run: npm ci --ignore-scripts

      - name: Fail on schema or lockfile drift
        run: git diff --exit-code -- src/contracts/schemas/ package-lock.json
